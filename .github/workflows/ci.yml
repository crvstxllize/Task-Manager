name: Flask CI-CD

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flask-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-test-package:
    name: Quality, tests and ZIP artifact
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Quality Check - Ruff lint and format
        run: |
          python -m ruff check .
          python -m ruff format --check .

      - name: Tests - pytest
        run: python -m pytest -v

      - name: Package Artifact - clean source ZIP
        run: python scripts/package.py

      - name: Upload ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: devops-task-manager
          path: dist/devops-task-manager.zip
          if-no-files-found: error
          retention-days: 14

  deploy-test:
    name: Deploy to Test and Healthcheck
    needs: quality-test-package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout deployment tools
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download tested ZIP artifact
        uses: actions/download-artifact@v4
        with:
          name: devops-task-manager
          path: dist

      - name: Deploy to Test - unpack ZIP and install clean runtime
        run: >-
          python scripts/deploy_test.py prepare dist/devops-task-manager.zip
          --directory "${{ runner.temp }}/devops-test"

      - name: Healthcheck - start Flask, wait, verify HTTP CRUD and stop
        run: >-
          python scripts/deploy_test.py check
          --directory "${{ runner.temp }}/devops-test"
