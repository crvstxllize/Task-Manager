name: Docker test deployment

on:
  push:
    branches: [defense/final-v1, main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test-deployment:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GIT_SHA: ${{ github.sha }}
      TASK_MANAGER_PORT: "5002"
      COMPOSE_PROJECT_NAME: ci-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Check code quality
        run: |
          python -m ruff check .
          python -m ruff format --check .
      - name: Test application
        run: python -m pytest -q
      - name: Build image from the tested commit
        run: |
          test "$(git rev-parse HEAD)" = "$GIT_SHA"
          docker compose build web
      - name: Deploy built image and wait for health
        run: docker compose up -d --no-build --pull never --wait --wait-timeout 90 web
      - name: Verify HTTP health, Git revision and task persistence
        run: python scripts/healthcheck.py --url "http://127.0.0.1:$TASK_MANAGER_PORT" --expected-sha "$GIT_SHA" --crud
      - name: Verify upgrade preserves tasks
        env:
          BASELINE_SHA: af400ff76615ec5144551a845eb2a7285cee3aa9
        run: python scripts/verify_upgrade.py "$BASELINE_SHA" "$GIT_SHA"
      - name: Show container logs on failure
        if: failure()
        run: docker compose logs --no-color web
      - name: Remove test environment
        if: always()
        run: docker compose down --volumes
