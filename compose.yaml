name: devops-task-manager
services:
  web:
    build:
      context: .
      args:
        APP_VERSION: "1.1.0"
        GIT_SHA: ${GIT_SHA:-}
    ports:
      - "127.0.0.1:${TASK_MANAGER_PORT:-5002}:5000"
    volumes:
      - sqlite-data:/data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - |
          import json, sys, urllib.request
          with urllib.request.urlopen("http://127.0.0.1:5000/health", timeout=2) as response:
              sys.exit(0 if response.status == 200 and json.load(response) == {"status": "ok"} else 1)
      interval: 5s
      timeout: 3s
      start_period: 10s
      retries: 3

volumes:
  sqlite-data:
