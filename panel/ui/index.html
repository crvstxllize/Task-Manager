<!doctype html>
<html lang="ru" data-theme-key="theme"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="/deploy-icon.png" type="image/png" sizes="64x64">
<script src="/theme.js"></script>
<title>Развёртывание · DevOps Task Manager</title>
<link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="/panel.css"><script src="/panel.js" defer></script></head>
<body><div class="ambient" aria-hidden="true"><i></i><i></i><i></i></div>
<header class="masthead"><div class="frame bar"><span class="brand"><img class="brand-mark" src="/deploy-mark.svg" width="32" height="32" alt="">DevOps Task Manager</span>
<button id="theme-toggle" hidden type="button" aria-label="Светлая тема" aria-pressed="false" title="Светлая или тёмная тема">
        <svg class="sun" aria-hidden="true" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.5 1.5m11 11L19 19M5 19l1.5-1.5m11-11L19 5"/></svg>
        <svg class="moon" aria-hidden="true" viewBox="0 0 24 24"><path d="M20.5 14a8.8 8.8 0 0 1-10.6-11A9 9 0 1 0 20.5 14Z"/></svg>
      </button></div></header>
<main class="frame"><section class="hero"><div><h1>Панель развёртывания</h1><p id="app">Проверяем приложение…</p><code id="revision"></code></div>
<div class="actions"><button class="primary" id="deploy">Развернуть</button><a href="http://127.0.0.1:5000/">Открыть приложение ↗</a></div></section>
<p role="status" id="notice"></p><section class="checks"><h2>Проверки main</h2><p id="ci"></p><div id="checks"></div></section>
<div class="columns"><section><h2>История запусков</h2><div id="runs" data-theme-scroll></div></section><section><h2 id="selected">Лог запуска</h2><pre id="log" data-theme-scroll>Выберите запуск в истории.</pre></section></div>
</main></body></html>
