<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Развёртывание · DevOps Task Manager</title>
<link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="/panel.css"><script src="/panel.js" defer></script></head>
<body><div class="ambient" aria-hidden="true"><i></i><i></i><i></i></div>
<header class="masthead"><div class="frame bar"><span class="brand"><span class="brand-mark" aria-hidden="true"><i></i></span>DevOps Task Manager</span>
<button id="theme" aria-label="Светлая тема" aria-pressed="false">☼ / ☾</button></div></header>
<main class="frame"><section class="hero"><div><h1>Панель развёртывания</h1><p id="app">Проверяем приложение…</p><code id="revision"></code></div>
<div class="actions"><button class="primary" id="deploy">Развернуть</button><a href="http://127.0.0.1:5000/">Открыть приложение ↗</a></div></section>
<p role="status" id="notice"></p><section class="checks"><h2>Проверки main</h2><p id="ci"></p><div id="checks"></div></section>
<div class="columns"><section><h2>История запусков</h2><div id="runs"></div></section><section><h2 id="selected">Лог запуска</h2><pre id="log">Выберите запуск в истории.</pre></section></div>
</main></body></html>
